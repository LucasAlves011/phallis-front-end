version: '3'
services:
  app:
    container_name: sml-front-phalis
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_TURNSTILE_SITEKEY=${NEXT_PUBLIC_TURNSTILE_SITEKEY}
        - NEXT_PUBLIC_DISABLE_MSW=${NEXT_PUBLIC_DISABLE_MSW}
    restart: always
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_TURNSTILE_SITEKEY=${NEXT_PUBLIC_TURNSTILE_SITEKEY}
      - NEXT_PUBLIC_DISABLE_MSW=${NEXT_PUBLIC_DISABLE_MSW}
